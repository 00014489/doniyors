@if (openedAdventureId(); as adventureId) {

  <main class="page page--detail">
    @defer (on immediate) {
      <app-adventure-detail
        [adventureId]="adventureId"
        (close)="closeAdventure()" />
    }
  </main>

} @else {

  <main class="page">

    @switch (activeTab()) {

      @case ('home') {
        <app-home (openAdventure)="openAdventure($event)" />
      }

      @case ('qr') {
        @defer (on immediate) {
          <app-qr-code />
        }
      }

      @case ('profile') {
        @defer (on immediate) {
          <app-profile (open)="openAdventure($event)" />
        }
      }

    }

  </main>

  <!-- The nav is not rendered while a detail is open, so a tab change never
       has a detail to pop. -->
  <app-mobile-nav [(active)]="activeTab" />

}

<aside
  class="sidebar"
  [class.sidebar--collapsed]="collapsed()">

  <header class="sidebar__header">
    <button
      type="button"
      class="sidebar__toggle"
      (click)="toggle()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="(collapsed() ? 'admin.nav.expand' : 'admin.nav.collapse') | translate">

      <span class="material-symbols-rounded" aria-hidden="true">
        menu
      </span>

    </button>

    @if (!collapsed()) {
      <h1>{{ 'admin.nav.panel' | translate }}</h1>
    }
  </header>

  <nav [attr.aria-label]="'admin.nav.primary' | translate">
    <ul class="sidebar__nav">

      @for (item of items(); track item.route) {

        <li>

          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="collapsed() ? (item.label | translate) : null"
            [attr.title]="collapsed() ? (item.label | translate) : null">

            <span class="material-symbols-rounded" aria-hidden="true">
              {{ item.icon }}
            </span>

            @if (!collapsed()) {
              <span>{{ item.label | translate }}</span>
            }

          </a>

        </li>

      }

    </ul>
  </nav>

</aside>

@if (tg.isSupportedPlatform()) {

  @if (showSplash()) {

    <div
      class="splash-screen"
      [class.fade-out]="fadingOut()"
      role="status"
      aria-live="polite">

      <img
        [ngSrc]="splashImage()"
        fill
        priority
        alt="" />

      <span class="visually-hidden">
        Loading…
      </span>

    </div>

  } @else {

    @if (authError()) {
      <div class="auth-error-banner" role="alert">
        <p>{{ authError() }}</p>
      </div>
    }

    @switch (tg.deviceType()) {

      @case ('mobile') {
        <app-mobile-component />
      }

      @case ('desktop') {

        <!-- @if (auth.isAdmin()) { -->
          <app-desktop-component />
        <!-- } @else { -->
          <!-- <app-mobile-component /> -->
        <!-- } -->
      }
    }
  }

} @else {

  <div class="unsupported-screen" role="alert">
    <p>{{ tg.unsupportedReason() }}</p>
  </div>

}

server {
    listen 80;

    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles of the current build, so it has to be
    # revalidated every time or a deploy is not picked up. The SPA fallback
    # above lands here too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Translations are not content-hashed and change between deploys.
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        access_log off;
    }
}

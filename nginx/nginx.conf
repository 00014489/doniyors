user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    # Needed so proxied responses keep their media types.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Docker's embedded DNS. The proxied containers are resolved per request
    # through it (see the proxy_pass variables in conf.d), so nginx starts even
    # while an app container is still coming up, and follows a container that
    # restarts with a new address instead of proxying to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}

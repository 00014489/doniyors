# Production stack.
#
#   cp .env.example .env     # fill in every empty value
#   docker compose up -d --build
#
# See DEPLOY.md for the server prerequisites and day-to-day operations.

name: doniyors


# Docker keeps container logs forever by default, which eventually fills the
# disk. Every service rotates at 5 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The one connection string every .NET container uses. GSS encryption is off:
# it is Kerberos, which this setup does not use, and trying it made every
# connection log a missing libgssapi_krb5 error.
x-database: &database
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-MainDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};GSS Encryption Mode=Disable"


services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-MainDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Over TCP on purpose: on first start the image runs a temporary,
      # socket-only server to initialise the database, and a socket check
      # would report "ready" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    logging: *logging


  # Applies the EF Core migrations, then exits. The API and the bot wait for
  # it to succeed, so neither ever runs against an out-of-date schema.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      <<: *database
      TZ: ${TZ:-UTC}
      ASPNETCORE_ENVIRONMENT: Production

    logging: *logging


  backend:
    build:
      # Repo root: the image needs backend/ and shared/ together.
      context: .
      dockerfile: backend/Dockerfile
      target: final

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      <<: *database
      TZ: ${TZ:-UTC}
      ASPNETCORE_ENVIRONMENT: Production

      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}
      Jwt__Issuer: ${JWT_ISSUER:-MiniApp}
      Jwt__Audience: ${JWT_AUDIENCE:-MiniApp}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-60}

      # Verifies the Mini App's signed initData — the same token as the bot.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}

      # The Angular app is served from this same origin.
      Cors__AllowedOrigins__0: https://${DOMAIN:?Set DOMAIN in .env}

      # When a member's language changes here, the bot's menu button that
      # opens this address is relabelled to match.
      MiniApp__Url: https://${DOMAIN:?Set DOMAIN in .env}

    logging: *logging


  telegram-bot:
    build:
      # Repo root: the image needs telegram-bot/ and shared/ together.
      context: .
      dockerfile: telegram-bot/Dockerfile

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      <<: *database
      TZ: ${TZ:-UTC}
      ASPNETCORE_ENVIRONMENT: Production

      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}

      # nginx routes this path to the bot; see nginx/templates.
      Webhook__BaseUrl: https://${DOMAIN:?Set DOMAIN in .env}/webhook
      Webhook__Secret: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}

      # The bot's menu button opens the Mini App here.
      MiniApp__Url: https://${DOMAIN:?Set DOMAIN in .env}
      MiniApp__MenuButtonText: ${MINI_APP_BUTTON_TEXT:-Open app}

    logging: *logging


  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    logging: *logging


  # The only service reachable from outside. Terminates TLS and routes:
  #   /          -> frontend      /api/   -> backend      /webhook -> telegram-bot
  nginx:
    build:
      context: ./nginx

    restart: unless-stopped

    depends_on:
      - frontend
      - backend
      - telegram-bot

    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}

    ports:
      # Let's Encrypt validates over port 80, and Telegram only delivers
      # webhooks to 443, 80, 88 or 8443 — keep the defaults in production.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme_challenge:/var/www/certbot:ro

    logging: *logging


  # Obtains the Let's Encrypt certificate for DOMAIN and renews it.
  certbot:
    image: certbot/certbot:v5.8.0

    restart: unless-stopped

    depends_on:
      - nginx

    entrypoint: ["/bin/sh", "/opt/certbot.sh"]

    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}

    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_challenge:/var/www/certbot
      - ./certbot/certbot.sh:/opt/certbot.sh:ro

    logging: *logging


volumes:
  postgres_data:
  letsencrypt:
  acme_challenge:
